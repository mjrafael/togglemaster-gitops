# um binário só, disco local e retenção de 24h: o ambiente é destruído toda noite,
# então não há o que guardar em S3 nem motivo para separar leitura e escrita
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 24h
    # o collector manda os logs por OTLP, e os atributos que não viram label ficam como structured metadata
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: false
  # sem persistência o chart não monta nada em /var/loki, e o filesystem do container é somente leitura
  extraVolumes:
    - name: dados
      emptyDir: {}
  extraVolumeMounts:
    - name: dados
      mountPath: /var/loki
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
sidecar:
  rules:
    enabled: false
