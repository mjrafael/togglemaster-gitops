apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: togglemaster
  labels:
    app: flag-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flag-service
          image: 024532670257.dkr.ecr.us-east-1.amazonaws.com/togglemaster-dev/flag-service:93b2a9e2b089542f66aa1953cc2547b54a15110f
          ports:
            - containerPort: 8002
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8001
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flag-service-db
                  key: url
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # o filesystem da imagem e somente leitura, e o gunicorn precisa escrever em /tmp
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: flag-service
  namespace: togglemaster
spec:
  selector:
    app: flag-service
  ports:
    - port: 8002
      targetPort: 8002
