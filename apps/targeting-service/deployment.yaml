apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting-service
  namespace: togglemaster
  labels:
    app: targeting-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: targeting-service
  template:
    metadata:
      labels:
        app: targeting-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: targeting-service
          image: 024532670257.dkr.ecr.us-east-1.amazonaws.com/togglemaster-dev/targeting-service:568dbc57ce1316e72e5c5f2c7a7d7714b9398eed
          ports:
            - containerPort: 8003
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            # telemetria: o pod manda traces para o OTel Collector do próprio nó
            - name: OTEL_SERVICE_NAME
              value: targeting-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observabilidade.svc:4318
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=togglemaster,deployment.environment=dev
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            # métricas saem dos spans no collector e logs saem do arquivo do container,
            # então o SDK só precisa mandar traces
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_PYTHON_FLASK_EXCLUDED_URLS
              value: health
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8001
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: targeting-service-db
                  key: url
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # o filesystem da imagem e somente leitura, e o gunicorn precisa escrever em /tmp
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: targeting-service
  namespace: togglemaster
spec:
  selector:
    app: targeting-service
  ports:
    - port: 8003
      targetPort: 8003
