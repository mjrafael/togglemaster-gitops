      helm:
        releaseName: otel-collector
        valueFiles:
          - $values/observabilidade/otel-collector/values.yaml
    - repoURL: https://github.com/mjrafael/togglemaster-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observabilidade
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# dashboard, regra de alerta, contact points, runbook de self-healing e gerador de tráfego
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observabilidade-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mjrafael/togglemaster-gitops.git
    targetRevision: main
    path: observabilidade/config
  destination:
    server: https://kubernetes.default.svc
    namespace: observabilidade
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
