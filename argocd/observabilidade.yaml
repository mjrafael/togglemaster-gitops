# stack de observabilidade. os charts vêm dos repositórios oficiais com versão fixa,
# e os values ficam neste repositório (fonte "values"), então mudar configuração é commit
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.3.1
      helm:
        releaseName: kps
        valueFiles:
          - $values/observabilidade/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/mjrafael/togglemaster-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observabilidade
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # as CRDs do prometheus-operator passam do limite de anotação do apply tradicional
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
